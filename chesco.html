<html>
<head>

<title>Home Search Map - Wilmington / Wyomissing / Exton-West Chester / Bryn Mawr</title>

<style>
body { margin:0; padding:0; font-family: Arial, Helvetica, sans-serif; }
#map { position:absolute; top:0; bottom:0; width:100%; }
.layer-control { position:absolute; top:10px; right:10px; background:#fff; padding:12px;
  border-radius:6px; box-shadow:0 0 15px rgba(0,0,0,.25); z-index:1000;
  max-height:85vh; overflow-y:auto; -webkit-overflow-scrolling:touch; max-width:300px; }
.layer-control h2 { margin:0 0 6px 0; font-size:15px; }
.layer-control h3 { margin:14px 0 6px 0; font-size:13px; border-bottom:1px solid #ccc; padding-bottom:4px; }
.layer-control label { display:block; margin:7px 0; cursor:pointer; font-size:13px; padding:4px; }
.layer-control label:hover { background:#f5f5f5; }
.layer-control input { margin-right:7px; width:17px; height:17px; vertical-align:middle; }
.toggle-btn { background:#378ADD; color:#fff; border:none; padding:11px 14px; border-radius:5px;
  cursor:pointer; font-size:14px; font-weight:bold; width:100%; display:block; }
.toggle-btn:hover { background:#2a6bb5; }
.layer-control-content.collapsed { display:none; }
.legend { position:absolute; bottom:18px; left:10px; background:#fff; padding:10px 12px;
  border-radius:6px; box-shadow:0 0 12px rgba(0,0,0,.25); z-index:1000; font-size:12px; }
.legend div { margin:4px 0; }
.sw { display:inline-block; width:13px; height:13px; border-radius:50%; margin-right:6px; vertical-align:middle; border:1px solid #666; }
.leaflet-popup-content { font-size:13px; line-height:1.5; max-width:300px; }
.leaflet-popup-content h3 { margin:0 0 4px 0; font-size:15px; }
.tag { display:inline-block; padding:2px 7px; border-radius:3px; color:#fff; font-size:11px; font-weight:bold; }
.pass { color:#1a7f37; font-weight:bold; }
.fail { color:#c62828; font-weight:bold; }
.warn { color:#b26a00; font-weight:bold; }
.btn { display:inline-block; background:#006AFF; color:#fff !important; padding:5px 9px;
  border-radius:4px; text-decoration:none; font-size:11px; margin:3px 4px 0 0; }
.btn.rf { background:#C82021; }
table.f { width:100%; border-collapse:collapse; margin:6px 0; }
table.f td { padding:3px 4px; border-bottom:1px solid #eee; font-size:12px; }
table.f td:first-child { color:#555; width:38%; }
.cm { font-size:12px; margin:5px 0; }
.cm td { padding:2px 5px; border-bottom:1px solid #f0f0f0; }
@media (max-width:768px){ .layer-control{ top:10px; right:10px; left:10px; max-width:none;} .legend{display:none;} }
</style>

var map = L.map('map').setView([40.03,-75.60], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:18, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

function toggleLegend(){
  var c=document.getElementById('layerContent');
  var b=document.querySelector('.toggle-btn');
  c.classList.toggle('collapsed');
  b.innerHTML = c.classList.contains('collapsed') ? '▲ Show Layers' : '▼ Hide Layers';
}

function links(q){
  var e=encodeURIComponent(q);
  return '<a class="btn" target="_blank" href="https://www.zillow.com/homes/'+e+'_rb/">Zillow</a>'+
         '<a class="btn rf" target="_blank" href="https://www.redfin.com/city/search?query='+e+'">Redfin</a>';
}

function zone(o){
  var c = L.circle([o.lat,o.lng], {radius:o.radius, color:o.color, fillColor:o.color, fillOpacity:0.22, weight:3});
  var h = '<h3>'+o.name+'</h3>'+
    '<div><span class="tag" style="background:'+o.color+'">'+o.verdict+'</span></div>'+
    '<table class="f">'+
    '<tr><td>County</td><td>'+o.county+'</td></tr>'+
    '<tr><td>School district</td><td>'+o.sd+'</td></tr>'+
    '<tr><td>Rank / tier</td><td>'+o.rank+'</td></tr>'+
    '<tr><td>Price range</td><td>'+o.price+'</td></tr>'+
    '<tr><td>Typical lot</td><td>'+o.lot+'</td></tr>'+
    '<tr><td>New construction</td><td>'+o.nc+'</td></tr>'+
    '<tr><td>Limerick distance</td><td>'+o.lim+'</td></tr>'+
    '</table>'+
    '<div style="font-weight:bold;font-size:12px;margin-top:6px;">Drive to each work site</div>'+
    '<table class="cm">'+

    '<tr><td>Wyomissing PA</td><td>'+o.wyo+'</td></tr>'+
    '<tr><td>Exton PA</td><td>'+o.ext+'</td></tr>'+
    '<tr><td>West Chester PA</td><td>'+o.wc+'</td></tr>'+
    '<tr><td>Bryn Mawr PA</td><td>'+o.bm+'</td></tr>'+
    '</table>'+
    '<div style="margin:6px 0; font-size:12px;"><strong>Bottom line:</strong> '+o.note+'</div>'+
    links(o.query);
  c.bindPopup(h, {maxWidth:330});
  return c;
}
